name: CI

on:
  push:
  pull_request:

# Nothing here needs to write to the repository, so the job token may only read it.
permissions:
  contents: read

jobs:
  scripts:
    name: Shell, Lua and animation-format tests
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit (Dependabot keeps them current), not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lua 5.1, ShellCheck and the tools the tests use
        run: sudo apt-get update && sudo apt-get install -y lua5.1 shellcheck file python3-pil openssh-client

      - name: ShellCheck
        run: >
          shellcheck install.sh set-animation.sh studio-link.sh setup/*.sh native/build.sh
          native/build-reproducible.sh native/reproducible-inner.sh tests/run.sh
          router/usr/bin/be3600-screensaver router/usr/sbin/be3600-anim
          router/etc/init.d/be3600-screensaver

      # The shipped router binary must be exactly what native/be3600-player.c builds: the
      # build runs in a container pinned by digest with the compiler taken from a dated
      # snapshot of the Debian archive, so it comes out byte-for-byte the same for anyone.
      - name: The committed native player is reproducible from its source
        run: |
          file router/usr/bin/be3600-player | tee /dev/stderr | grep -q 'ARM aarch64'
          file router/usr/bin/be3600-player | grep -q 'statically linked'
          sh native/build-reproducible.sh --check

      - name: Lua syntax
        run: |
          for f in router/usr/bin/*.lua; do
            lua5.1 -e "assert(loadfile('$f'))" && echo "ok  $f"
          done

      - name: Tests
        run: LUA=lua5.1 sh tests/run.sh

  windows:
    name: Windows scripts parse, stay ASCII, and work
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse the PowerShell scripts
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.PSParser]::Tokenize((Get-Content $f.FullName -Raw), [ref]$errs)
            if ($errs.Count) { $bad++; $errs | ForEach-Object { "$($f.Name): $($_.Message)" } } else { "ok  $($f.Name)" }
          }
          if ($bad) { exit 1 }

      - name: Windows scripts must be ASCII (Windows PowerShell 5.1 misreads UTF-8 without a BOM)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1,*.cmd) {
            if ([IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }) { $bad++; "non-ASCII: $($f.FullName)" }
          }
          if ($bad) { exit 1 } else { "all ASCII" }

      # Real Windows: DPAPI, ssh-keygen and file permissions for the remembered key, address
      # checks, and the single-file Studio-Link.cmd itself (pairing, refusals, exact commands).
      - name: Windows key protection and address checks
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows_keys_test.ps1
          if ($LASTEXITCODE) { exit 1 }

      - name: The single-file Studio-Link.cmd works
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows_singlefile_test.ps1
          if ($LASTEXITCODE) { exit 1 }
