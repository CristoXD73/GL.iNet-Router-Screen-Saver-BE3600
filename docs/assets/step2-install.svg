<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Step 2: the first run puts the screen saver on your router</title>
  <desc id="d">Studio Link finds the router, asks for the router password once, offers to install the screen saver (press Enter), and offers to remember this computer (press Enter). Then it keeps running and Motion Studio opens by itself.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef0fb"/><stop offset="1" stop-color="#f8f5ff"/></linearGradient>
    <style>
      .term { fill: #12141f; }
      .tbar { fill: #232636; }
      .dot  { fill: #4a4f6a; }
      .h    { fill: #0e1122; font: 700 22px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .n    { fill: #ffffff; font: 700 18px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-anchor: middle; }
      .ch   { fill: #0e1122; font: 700 15px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .p    { fill: #4b516b; font: 400 13.5px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .s    { fill: #7b8098; font: 400 12px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .t    { fill: #d7dbf2; font: 400 13px Consolas, "SF Mono", Menlo, monospace; white-space: pre; }
      .tg   { fill: #4fd17c; font: 700 13px Consolas, "SF Mono", Menlo, monospace; }
      .ty   { fill: #ffd166; font: 700 13px Consolas, "SF Mono", Menlo, monospace; }
      .tc   { fill: #6fd6ff; font: 700 13px Consolas, "SF Mono", Menlo, monospace; }
      .call { fill: #ff8a3d; }
      .ring { fill: none; stroke: #ff8a3d; stroke-width: 2.5; }
      .card { fill: #ffffff; stroke: #dfe2f2; stroke-width: 1.5; }
      .line { stroke: #ff8a3d; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="900" height="500" rx="22" fill="url(#bg)"/>

  <circle cx="52" cy="46" r="18" fill="#0e1122"/><text class="n" x="52" y="52">2</text>
  <text class="h" x="80" y="53">Run it: it sets everything up</text>

  <!-- the Studio Link window -->
  <g transform="translate(30,90)">
    <rect class="term" width="560" height="384" rx="14"/>
    <path d="M0 14a14 14 0 0 1 14-14h532a14 14 0 0 1 14 14v22H0z" class="tbar"/>
    <circle class="dot" cx="22" cy="18" r="5"/><circle class="dot" cx="40" cy="18" r="5"/><circle class="dot" cx="58" cy="18" r="5"/>
    <text class="s" x="280" y="22" text-anchor="middle">Studio Link</text>

    <text class="tc" x="22" y="66">GL.iNet Router Screen Saver (BE3600)</text>
    <text class="t"  x="22" y="86">Studio Link</text>

    <text class="tg" x="22" y="118">ok</text><text class="t" x="52" y="118">Router found at 192.168.8.1</text>
    <text class="t"  x="22" y="146">Router admin password (kept in memory only): ********</text>
    <text class="tg" x="22" y="170">ok</text><text class="t" x="52" y="170">Logged in.</text>

    <text class="t"  x="22" y="204">This router does not have the screen saver yet.</text>
    <text class="ty" x="22" y="224">Put it on the router now? [Enter = yes, N = no]</text>
    <text class="tg" x="22" y="248">ok</text><text class="t" x="52" y="248">The screen saver is installed and running.</text>

    <text class="t"  x="22" y="282">Remember this computer? (skips the password next time)</text>
    <text class="ty" x="22" y="302">Remember it? [Enter = yes, N = no]</text>
    <text class="tg" x="22" y="326">ok</text><text class="t" x="52" y="326">Remembered. Next time there is nothing to type.</text>

    <text class="tg" x="22" y="360">Studio Link is running. Leave this window open.</text>

    <rect class="ring" x="12" y="130" width="536" height="30" rx="8"/>
    <rect class="ring" x="12" y="192" width="536" height="44" rx="8"/>
    <rect class="ring" x="12" y="270" width="536" height="44" rx="8"/>
  </g>

  <!-- callouts -->
  <path class="line" d="M566 235 C 600 235, 606 152, 640 152"/>
  <path class="line" d="M566 313 C 600 313, 606 268, 640 268"/>
  <path class="line" d="M566 391 C 600 391, 606 384, 640 384"/>

  <g transform="translate(640,112)">
    <rect class="card" width="230" height="80" rx="14"/>
    <circle class="call" cx="26" cy="26" r="14"/><text class="n" x="26" y="31" style="font-size:15px">1</text>
    <text class="ch" x="50" y="31">Type the password</text>
    <text class="p" x="16" y="54">Your router's admin password.</text>

  </g>
  <g transform="translate(640,228)">
    <rect class="card" width="230" height="80" rx="14"/>
    <circle class="call" cx="26" cy="26" r="14"/><text class="n" x="26" y="31" style="font-size:15px">2</text>
    <text class="ch" x="50" y="31">Press Enter</text>
    <text class="p" x="16" y="54">It puts the screen saver on</text>
    <text class="p" x="16" y="72">the router. About 10 seconds.</text>
  </g>
  <g transform="translate(640,344)">
    <rect class="card" width="230" height="80" rx="14"/>
    <circle class="call" cx="26" cy="26" r="14"/><text class="n" x="26" y="31" style="font-size:15px">3</text>
    <text class="ch" x="50" y="31">Press Enter again</text>
    <text class="p" x="16" y="54">So the password is never asked</text>
    <text class="p" x="16" y="72">again (N to skip this).</text>
  </g>

  <text class="s" x="640" y="450">Then Motion Studio opens by itself.</text>
  <text class="s" x="640" y="467">Leave this window open while you use it.</text>
</svg>
